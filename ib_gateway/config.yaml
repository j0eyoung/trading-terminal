name: IB Gateway
version: "0.1.4"
slug: ib_gateway
description: Interactive Brokers Gateway (headless, auto-login) for the Trading Terminal add-on
arch:
  - aarch64
  - amd64
init: false
startup: services  # starts before the Trading Terminal add-on (startup: application)
# Nothing is published outside Home Assistant by default. The Trading Terminal add-on reaches it
# on Home Assistant's internal add-on network, using the hostname on this add-on's Info tab,
# port 4004 (paper) or 4003 (live).
ports:
  4003/tcp: null
  4004/tcp: null
ports_description:
  4003/tcp: Live API (leave empty unless a program outside Home Assistant needs it)
  4004/tcp: Paper API (leave empty unless a program outside Home Assistant needs it)
options:
  trading_mode: paper
  paper_username: ""
  paper_password: ""
  live_username: ""
  live_password: ""
  read_only_api: false
  # Headless gateway: nobody can click IBKR's warning pop-ups, which otherwise hold API orders.
  # The Trading Terminal still asks you to review and submit every order.
  skip_order_warnings: true
  allow_trading_without_market_data: true
  relogin_after_2fa_timeout: true
  twofa_timeout_action: restart
  twofa_device: ""
  auto_restart_time: "11:59 PM"
  time_zone: America/Denver
schema:
  # paper: log in to the paper account only. live: live only. both: run both at once (more memory).
  trading_mode: list(paper|live|both)
  paper_username: str?
  paper_password: password?
  live_username: str?
  live_password: password?
  read_only_api: bool
  skip_order_warnings: bool
  allow_trading_without_market_data: bool
  relogin_after_2fa_timeout: bool
  twofa_timeout_action: list(restart|exit)
  twofa_device: str?
  auto_restart_time: str
  time_zone: str
